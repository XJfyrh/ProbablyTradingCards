name: 玩法规则与卡牌资源检查

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    name: Smoke、Python 测试与纹理校验
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 检查 GitHub Actions 工作流
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'actionlint.zip'
          $bin = Join-Path $env:RUNNER_TEMP 'actionlint'
          Invoke-WebRequest 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_windows_amd64.zip' -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne '6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9') { throw 'actionlint 压缩包 SHA-256 不匹配' }
          Expand-Archive -LiteralPath $zip -DestinationPath $bin
          & (Join-Path $bin 'actionlint.exe')
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: 安装 Python 依赖
        run: python -m pip install --group lint -r scripts/requirements.txt -r scripts/requirements-comments.txt
      - name: 检查 Python 脚本
        run: python -m ruff check .
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: 检查玩法与存档规则
        run: dotnet run --project tests/Smoke/Smoke.csproj -c Release
      - name: 验证卡辑作者工具能拒绝破坏性变更
        run: python -X utf8 tests/check_series_identities.py
      - name: 对照已发布版本核对卡辑标识
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python -X utf8 tests/check_published_series.py --base $env:BASE_REVISION
      - name: 检查新增或改写的代码注释
        env:
          COMMENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python -X utf8 scripts/check_comments.py --base $env:COMMENT_BASE
      - name: 运行 Python 测试
        run: python -X utf8 -m unittest discover -s tests -p 'test_*.py'
      - name: 校验主模组纹理
        run: python -X utf8 scripts/export_series.py --check-core
      - name: 对比原画与已提交的游戏贴图
        run: python -X utf8 scripts/check_art_exports.py
