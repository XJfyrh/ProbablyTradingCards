name: 脚本和卡牌纹理检查

on:
  pull_request:
    paths:
      - '.github/workflows/checks.yml'
      - 'scripts/**'
      - 'tests/test_*.py'
      - 'ProbablyTradingCards/Series/**'
      - 'ProbablyTradingCards/Textures/**'
      - 'Examples/DockLetters/Series/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/checks.yml'
      - 'scripts/**'
      - 'tests/test_*.py'
      - 'ProbablyTradingCards/Series/**'
      - 'ProbablyTradingCards/Textures/**'
      - 'Examples/DockLetters/Series/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts-and-textures:
    name: Python 测试与纹理校验
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: 安装 Python 依赖
        run: python -m pip install -r scripts/requirements.txt
      - name: 运行 Python 测试
        run: python -X utf8 -m unittest discover -s tests -p 'test_*.py'
      - name: 校验主模组纹理
        run: python -X utf8 scripts/export_series.py --check-core
